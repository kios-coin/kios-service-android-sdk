plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace 'org.kios.service.android.sdk'
    compileSdk 35

    defaultConfig {
        minSdk 24

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    packagingOptions {
        resources {
            excludes += "/META-INF/DISCLAIMER"
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation "org.json:json:20231013"
    implementation "com.googlecode.libphonenumber:libphonenumber:8.13.44"
    implementation 'org.web3j:core:4.9.8'
    implementation 'org.web3j:abi:4.9.8'
    implementation 'org.web3j:crypto:4.9.8'
    implementation 'org.web3j:utils:4.9.8'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.68'
}
